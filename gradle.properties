kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Memory budget: ~10 GB ceiling across every JVM this build starts.
# The Kotlin/Native compiler gets the largest share because linking the
# no-cache executable against Skia is by far the heaviest step.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.native.jvmArgs=-Xmx6g
org.gradle.workers.max=4
